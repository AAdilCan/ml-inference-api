services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENABLE_CACHE=true
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=3600
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
